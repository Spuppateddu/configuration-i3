#  ─── Backend & perf ──────────────────────────────────────────────────────
backend = "glx";
vsync = true;
use-damage = true;
# Drops compositing entirely for fullscreen windows (video, games). Costs a
# brief flicker as redirection is dropped and retaken.
unredir-if-possible = true;
detect-rounded-corners = true;
detect-client-opacity = true;

#  ─── Corners ─────────────────────────────────────────────────────────────
corner-radius = 0;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

#  ─── Shadows ─────────────────────────────────────────────────────────────
# Off: on an iGPU every repaint costs the same RAM bandwidth as the CPU, and the
# excludes already dropped Alacritty. Set true to restore — nothing below moved.
shadow = false;
# Gaussian blur: cost grows with the square of the radius, so 20 was ~2.7x the
# work of 12 for a difference you have to look for.
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.35;
shadow-exclude = [
    # Repainted on every terminal update, and Alacritty is already translucent
    # so the shadow mostly shows through the window it should be lifting.
    "class_g = 'Alacritty'",
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c"
];

#  ─── Fades ───────────────────────────────────────────────────────────────
# Off: ~9 full repaints (0.11/step) per open, close and workspace switch, which
# in a tiling WM is constant. The tuning below still restores it exactly.
fading = false;
# One repaint per step, so 16ms = one step per frame at 60Hz; the larger step
# keeps the fade the same ~145ms for a third of the work.
fade-in-step = 0.11;
fade-out-step = 0.11;
fade-delta = 16;

#  ─── Opacity ─────────────────────────────────────────────────────────────
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "100:class_g = 'firefox'",
    "100:class_g = 'Chromium'",
    "100:class_g = 'Google-chrome'",
    "100:fullscreen"
];

#  ─── Blur (disabled by default; enable if you want frosted feel) ─────────
# blur-method = "dual_kawase";
# blur-strength = 4;
# blur-background = false;

#  ─── Window types ────────────────────────────────────────────────────────
wintypes:
{
    tooltip     = { fade = true; shadow = true; opacity = 0.92; focus = true; };
    dock        = { shadow = false; };
    dnd         = { shadow = false; };
    popup_menu  = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
};
