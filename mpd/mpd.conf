# User-level MPD config. Music folder = ~/Music.

music_directory     "~/Music"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
log_file            "~/.local/share/mpd/log"
pid_file            "~/.local/share/mpd/pid"
state_file          "~/.local/share/mpd/state"
sticker_file        "~/.local/share/mpd/sticker.sql"

auto_update         "yes"
restore_paused      "yes"

# No bind_to_address / port on purpose: mpd.socket owns both listeners (unix +
# localhost:6600) and starts mpd on demand. Setting them here = bind twice, die.

# That TCP listener is loopback but unauthenticated — any local account can drive
# playback. Fine on a single-user laptop; drop ListenStream=6600 if it stops being.

# PipeWire (via its PulseAudio server) — works out of the box on Ubuntu 25.10.
audio_output {
    type        "pulse"
    name        "PipeWire"
}

# Silent output feeding ncmpcpp's visualizer — must match
# visualizer_data_source / visualizer_output_name there, or the pane stays blank.
# Not in /tmp: another local user could plant the fifo and read the raw audio.
audio_output {
    type        "fifo"
    name        "Visualizer"
    path        "~/.local/share/mpd/fifo"
    format      "44100:16:2"
}

# Pretty unicode filter / mixer
filesystem_charset "UTF-8"
replaygain         "album"
volume_normalization "yes"
