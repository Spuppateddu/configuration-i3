[Settings]
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Yaru
gtk-application-prefer-dark-theme=1
# Same single family as ../config; GTK dialogs are fixed-width as a result.
# GNOME and GTK2 apps read gsettings / ~/.gtkrc-2.0 instead of this file.
gtk-font-name=Cascadia Code 11
gtk-cursor-theme-name=macOS
gtk-cursor-theme-size=24
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
